##############################################################
# GitHub Actions — Check external links with lychee
# Runs every Monday, on demand, and on pull requests that touch
# the notes. A scheduled/manual run with broken links opens (or
# updates) a single "Broken links report" issue.
##############################################################

name: "Check Links"

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"
      - "_includes/**"
      - ".lycheeignore"

permissions:
  contents: read
  issues:   write

jobs:

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

  # ── Relative and root-relative links resolve under the site's own URL via --base-url,
  #    which .lycheeignore excludes — so only external links are checked here.

      - name: "🔗 Check links with lychee"
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --base-url https://marcogrimaldi29.com/dp-600-study-notes/
            --accept '100..=103,200..=299,429'
            --max-retries 3
            './*.md' './_includes/*.html'
          fail: false

      - name: "🔎 Find an open broken-links issue"
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'in:title "Broken links report"' --json number --jq '.[0].number // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: "🐞 Open or update the broken-links issue"
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "🔗 Broken links report"
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.find-issue.outputs.number }}
          labels: broken-links

      - name: "❌ Fail when links are broken"
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
